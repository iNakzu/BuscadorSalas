name: Despliegue Automático en Oracle Cloud

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validar V1
        env:
          SCHEDULE_DATA_URL: http://127.0.0.1:9/unavailable
          SCHEDULE_CACHE_FILE: /tmp/buscadorsalas-tests.json
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/personal-store.test.cjs
          node tests/app-security.test.cjs
          node tests/auth-ui.test.cjs
          node tests/malla-career-gate.test.cjs
          node tests/community-schedules.test.cjs
          node tests/admin-profile-editing.test.cjs
          node tests/public-shared-views.test.cjs
          node tests/community-schedule-overlay.test.cjs
          node tests/community-solemnes.test.cjs
          node tests/notes-schema.test.cjs
          node tests/schedule-class-edit.test.cjs
          node tests/schedule-import-ui.test.cjs
          node tests/schedule-mobile-day-focus.test.cjs

      - name: Ejecutar despliegue vía SSH en la VM
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/BuscadorSalas
            git pull --ff-only
            source venv/bin/activate
            pip install -r requirements.txt
            sudo install -d -o ubuntu -g ubuntu /var/lib/buscadorsalas
            sudo cp buscadorsalas.service /etc/systemd/system/buscadorsalas.service
            sudo systemctl daemon-reload
            sudo cp nginx_api_limits.conf /etc/nginx/conf.d/buscadorsalas_api_limits.conf
            sudo cp nginx_buscadorsalas.conf /etc/nginx/sites-available/buscadorsalas
            sudo nginx -t && sudo systemctl reload nginx
            sudo systemctl reload buscadorsalas
            sleep 2
            curl --fail --silent --show-error http://127.0.0.1:5000/api/status >/dev/null
