server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 144.22.33.41 _;

    client_max_body_size 25M;

    # Validación automática de certificados de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Todo el tráfico normal usa HTTPS.
    location / {
        return 301 https://horarios.dev$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name portal.144-22-33-41.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://horarios.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name portal.144-22-33-41.sslip.io;

    ssl_certificate /etc/letsencrypt/live/portal.144-22-33-41.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.144-22-33-41.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        return 301 https://horarios.dev$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name horarios.dev;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://horarios.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name horarios.dev;

    ssl_certificate /etc/letsencrypt/live/horarios.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horarios.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name 144.22.33.41 _;

    ssl_certificate /etc/letsencrypt/live/144.22.33.41/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144.22.33.41/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Fuerza navegación y recursos seguros en navegadores compatibles.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        return 301 https://horarios.dev$request_uri;
    }
}
