server {
    listen 80;
    listen [::]:80;
    server_name v1.144-22-33-41.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://v1.144-22-33-41.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v1.144-22-33-41.sslip.io;

    ssl_certificate /etc/letsencrypt/live/v1.144-22-33-41.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v1.144-22-33-41.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
