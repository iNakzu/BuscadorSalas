<div class="my-modal-overlay" id="modal-agenda" onclick="if(event.target === this) cerrarModalAgenda()" style="display: none;">
<div aria-modal="true" class="my-modal-dialog" role="dialog" style="max-width: 400px; padding: 26px 28px;">
<div class="my-modal-header">
<div>
<div class="my-modal-title" id="agenda-modal-title">Añadir Evaluación</div>
<div id="agenda-modal-subtitle" style="color: #38bdf8; font-size: 13px; font-weight: 600; margin-top: 4px;">25 Septiembre 2026</div>
</div>
<button class="my-modal-close" onclick="cerrarModalAgenda()" title="Cerrar" type="button">×</button>
</div>
<form id="form-agenda" onsubmit="guardarEventoAgenda(event)">
<input id="agenda-id" type="hidden" value=""/>
<input id="agenda-fecha-base" type="hidden" value=""/> <!-- YYYY-MM-DD -->
<div class="my-form-group">
<label class="my-form-label">Asignatura</label>
<div class="custom-dropdown" id="dd-agenda-ramo" style="width: 100%;">
<button class="dropdown-trigger my-form-input" onclick="toggleDropdown('dd-agenda-ramo')" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left;" type="button">
<span id="label-agenda-ramo" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Selecciona un Ramo...</span>
<svg class="dropdown-chevron" fill="none" height="16" stroke="currentColor" stroke-width="2.5" style="flex-shrink: 0; margin-left: 8px;" viewbox="0 0 24 24" width="16"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
<div class="dropdown-menu" style="max-height: 200px;">
</div>
<input id="agenda-ramo" required="" type="hidden" value=""/>
</div>
</div>
<div class="my-form-group">
<label class="my-form-label">Tipo de Evaluación</label>
<div class="custom-dropdown" id="dd-agenda-tipo" style="width: 100%;">
<button class="dropdown-trigger my-form-input" onclick="toggleDropdown('dd-agenda-tipo')" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left;" type="button">
<span id="label-agenda-tipo">Solemne / Prueba</span>
<svg class="dropdown-chevron" fill="none" height="16" stroke="currentColor" stroke-width="2.5" style="flex-shrink: 0; margin-left: 8px;" viewbox="0 0 24 24" width="16"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
<div class="dropdown-menu">
<div class="dropdown-item active" data-val="Solemne" onclick="selectDropdownItem('dd-agenda-tipo', 'Solemne', 'Solemne / Prueba')">Solemne / Prueba</div>
<div class="dropdown-item" data-val="Control" onclick="selectDropdownItem('dd-agenda-tipo', 'Control', 'Control / Quiz')">Control / Quiz</div>
<div class="dropdown-item" data-val="Trabajo" onclick="selectDropdownItem('dd-agenda-tipo', 'Trabajo', 'Entrega de Trabajo / Informe')">Entrega de Trabajo / Informe</div>
<div class="dropdown-item" data-val="Presentacion" onclick="selectDropdownItem('dd-agenda-tipo', 'Presentacion', 'Presentación / Disertación')">Presentación / Disertación</div>
</div>
<input id="agenda-tipo" required="" type="hidden" value="Solemne"/>
</div>
</div>
<div class="my-form-group" onclick="toggleHoraOpcional()" style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px;">
<div id="hora-checkbox" style="width: 20px; height: 20px; border-radius: 6px; border: 2px solid rgba(56, 189, 248, 0.5); display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.5); transition: all 0.2s;">
<svg fill="none" height="12" id="hora-check-icon" stroke="currentColor" stroke-width="3" style="display: none; color: #38bdf8;" viewbox="0 0 24 24" width="12"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<label style="cursor: pointer; color: #cbd5e1; font-size: 13.5px; font-weight: 500;">Especificar Hora (Opcional)</label>
<input id="agenda-has-time" type="hidden" value="false"/>
</div>
<div class="my-form-group" id="grupo-hora" style="display: none; animation: fadeIn 0.2s ease;">
<input class="my-form-input" id="agenda-hora" type="time"/>
</div>
<div class="my-form-group">
<label class="my-form-label">Notas Adicionales (Opcional)</label>
<input class="my-form-input" id="agenda-notas" placeholder="Ej. Estudiar cap. 3..." type="text"/>
</div>
<div class="my-modal-actions" style="border-top: none; padding-top: 12px; margin-top: 8px;">
<button class="my-btn-primary" style="width: 100%; justify-content: center; font-size: 14.5px;" type="submit">Guardar Evento</button>
</div>
</form>
</div>
</div>
