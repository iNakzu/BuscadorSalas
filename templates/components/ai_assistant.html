<button class="ai-fab-btn" id="ai-assistant-toggle" type="button" aria-label="Abrir asistente inteligente" aria-controls="ai-chat-window" aria-expanded="false">
  <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="rgba(255,255,255,.15)" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
</button>

<section class="ai-chat-window" id="ai-chat-window" role="dialog" aria-label="Asistente Inteligente" aria-hidden="true" hidden>
  <header class="ai-chat-header">
    <div class="ai-header-info">
      <div class="ai-avatar" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(255,255,255,.15)" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
      <div class="ai-title-text"><h4>Asistente Inteligente</h4><p>Pregunta lo que quieras</p></div>
    </div>
    <div class="ai-header-actions">
      <button class="ai-close-btn" id="ai-close" type="button" aria-label="Cerrar asistente" title="Cerrar">&times;</button>
    </div>
  </header>

  <div class="ai-messages-area" id="ai-messages-area" aria-live="polite" aria-relevant="additions">
    <div class="ai-msg bot"><strong>¿En qué te ayudo?</strong><br>Pregunta sobre tus estudios o adjunta una imagen para analizarla.</div>
  </div>

  <div class="ai-composer">
    <div class="ai-attachment-preview" id="ai-attachment-preview" hidden>
      <div class="ai-preview-thumb-container"><img id="ai-preview-img" alt="Vista previa de la imagen adjunta"><button class="ai-preview-remove" id="ai-remove-image" type="button" aria-label="Quitar imagen" title="Quitar imagen">&times;</button></div>
      <span class="ai-preview-filename" id="ai-preview-filename"></span>
    </div>
    <div class="ai-input-row">
      <input type="file" id="ai-file-input" accept="image/png,image/jpeg,image/webp" hidden>
      <button class="ai-attach-btn" id="ai-attach" type="button" aria-label="Adjuntar imagen" title="Adjuntar imagen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
      <textarea id="ai-chat-input" rows="1" maxlength="3000" placeholder="Pregunta lo que quieras…" autocomplete="off"></textarea>
      <button class="ai-send-btn" id="ai-send" type="button" aria-label="Enviar mensaje" title="Enviar mensaje"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></button>
    </div>
    <div class="ai-composer-hint">La IA puede cometer errores. Verifica la información importante.</div>
  </div>
</section>

<div class="ai-image-lightbox" id="ai-image-lightbox" role="dialog" aria-label="Vista ampliada de la imagen" aria-modal="true" hidden>
  <div class="ai-lightbox-content">
    <button class="ai-lightbox-close" id="ai-lightbox-close" type="button" aria-label="Cerrar imagen">&times;</button>
    <img id="ai-lightbox-img" alt="Imagen ampliada">
  </div>
</div>
